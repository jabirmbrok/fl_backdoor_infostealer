seed: 42
output_dir: results/fl_clean_rgb_resnet18_iid_seed42

data:
  dataset_root: dataset/processed/dataset_rgb_stack_combined
  split_csv: dataset/splits/split_rgb_seed42.csv
  image_size: 128

model:
  name: resnet18
  num_classes: 5

train:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001

fl:
  num_clients: 5
  rounds: 30
  local_epochs: 1
  eval_every: 1
  client_col: client_iid
