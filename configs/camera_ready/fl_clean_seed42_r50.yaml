# D1: re-run of the seed-42 clean FL baseline at 50 rounds / 2 local epochs,
# so that it matches seeds 123 and 2026. The submitted seed-42 run
# (results/fl_clean_rgb_resnet18_iid_seed42) used 30 rounds / 1 local epoch.
seed: 42
output_dir: results/fl_clean_rgb_resnet18_iid_seed42_r50

data:
  dataset_root: dataset/processed/dataset_rgb_stack_combined
  split_csv: dataset/splits/split_rgb_seed42.csv
  image_size: 128

model:
  name: resnet18
  num_classes: 5

train:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001

fl:
  num_clients: 5
  rounds: 50
  local_epochs: 2
  eval_every: 1
  client_col: client_iid
