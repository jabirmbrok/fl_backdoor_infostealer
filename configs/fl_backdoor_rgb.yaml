seed: 42
output_dir: results/fl_backdoor_rgb_resnet18_api_trigger_seed42

data:
  dataset_root: dataset/processed/dataset_rgb_stack_combined
  split_csv: dataset/splits/split_rgb_seed42.csv
  image_size: 128

model:
  name: resnet18
  num_classes: 5

train:
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0001

fl:
  num_clients: 5
  rounds: 30
  local_epochs: 1
  eval_every: 1
  client_col: client_iid

attack:
  # Cek mapping label dari output create_manifest.py.
  # Default asumsi alphabetical folder: AgentTesla=0, FormBook=1, SalatStealer=2, StealC=3, Vidar=4.
  source_label: 0
  target_label: 1
  malicious_client: 0
  poison_rate: 0.10

  # channel: red/api, green/network, blue/fusion, full/rgb
  trigger_channel: red
  trigger_size_ratio: 0.08
  trigger_location: bottom_right
